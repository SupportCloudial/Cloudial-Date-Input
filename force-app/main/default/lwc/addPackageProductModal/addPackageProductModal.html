<template>
    <lightning-modal-body class="scrollable modal-body">
        <div class="modal-shell">
            <header class="modal-header">
                <div class="modal-title">{header}</div>
                <div class="modal-header-search">
                    <lightning-input
                        type="search"
                        label={nameSearchLabel}
                        placeholder={nameSearchPlaceholder}
                        value={searchKey}
                        onchange={handleHeaderSearchChange}
                    ></lightning-input>
                </div>
            </header>
            <div class="modal-body-relative-height">
                <c-add-package-product
                    record-id={recordId}
                    object-api-name={objectApiName}
                    replace-mode={replaceMode}
                    replaced-order-item-id={replacedOrderItemId}
                    order-end-date={orderEndDate}
                    order-start-date={orderStartDate}
                    replaced-product-end-date={replacedProductEndDate}
                    replaced-active-end-date-ymd={replacedActiveEndDateYmd}
                    onaddproducts={handleAddProducts}
                    onreplaceproduct={handleReplaceProduct}
                    onproductselect={handleProductSelect}
                    onpackagebuildernotify={handlePackageBuilderNotify}
                ></c-add-package-product>
            </div>
        </div>
    </lightning-modal-body>

    <lightning-modal-footer>
        <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
            <template for:each={btnOptions} for:item="option">
                <lightning-button
                        class="slds-m-around_xx-small"
                        onclick={handleOptionClick}
                        data-id={option.val}
                        key={option.val}
                        variant={option.variant}
                        label={option.label}>
                </lightning-button>
            </template>
            <lightning-button
                class="slds-m-horizontal_small"
                variant="brand"
                label={primaryButtonLabel}
                disabled={primaryButtonDisabled}
                onclick={handlePrimaryClick}
                title={primaryButtonLabel}>
            </lightning-button>
        </div>
    </lightning-modal-footer>

</template>
