<template>
    <div class={backdropClass} onclick={handleBackdropClick}></div>
    <aside
        class={sheetClass}
        role="dialog"
        aria-label={headerLabel}
        aria-hidden={ariaHidden}
        onkeydown={handleKeydown}
    >
        <header class="add-products-sheet__header">
            <div class="add-products-sheet__title-row">
                <div class="add-products-sheet__title">{headerLabel}</div>
                <div class="add-products-sheet__header-search">
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        label={nameSearchLabel}
                        placeholder={nameSearchPlaceholder}
                        value={searchKey}
                        onchange={handleHeaderSearchChange}
                    ></lightning-input>
                </div>
                <button
                    type="button"
                    data-add-products-close
                    class="add-products-sheet__close-btn"
                    aria-label="Close"
                    title="Close"
                    onclick={handleClose}
                >
                    <lightning-icon icon-name="utility:close" size="x-small" alternative-text=""></lightning-icon>
                </button>
            </div>
        </header>

        <div class="add-products-sheet__body">
            <template lwc:if={isOpen}>
                <c-add-package-product
                    key={sessionKey}
                    record-id={recordId}
                    object-api-name={objectApiName}
                    replace-mode={replaceMode}
                    replaced-order-item-id={replacedOrderItemId}
                    replaced-pricebook-entry-id={replacedPricebookEntryId}
                    order-end-date={orderEndDate}
                    order-start-date={orderStartDate}
                    replace-default-period-start-ymd={replaceDefaultPeriodStartYmd}
                    replaced-product-end-date={replacedProductEndDate}
                    replaced-active-end-date-ymd={replacedActiveEndDateYmd}
                    onaddproducts={handleComplete}
                    onreplaceproduct={handleComplete}
                    onproductselect={handleProductSelect}
                    onpackagebuildernotify={handleNotify}
                ></c-add-package-product>
            </template>
        </div>

        <footer class="add-products-sheet__footer">
            <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                <lightning-button
                    class="slds-m-around_xx-small"
                    onclick={handleClose}
                    variant="neutral"
                    label={cancelLabel}
                ></lightning-button>
                <lightning-button
                    class="slds-m-horizontal_small"
                    variant="neutral"
                    label={primaryButtonLabel}
                    disabled={primaryButtonDisabled}
                    onclick={handlePrimaryClick}
                    title={primaryButtonLabel}
                ></lightning-button>
            </div>
        </footer>
    </aside>
</template>
