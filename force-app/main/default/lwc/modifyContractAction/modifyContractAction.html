<template>
    <lightning-quick-action-panel header="Modify Contract">
        <div class="glass-shell slds-p-around_medium">
            <template if:true={loading}>
                <div class="slds-p-vertical_large spinner-wrap">
                    <lightning-spinner alternative-text="Loading active contracts"></lightning-spinner>
                </div>
            </template>

            <template if:true={showSelector}>
                <section class="glass-card slds-p-around_medium">
                    <p class="title">Select an Active Contract</p>
                    <p class="subtitle slds-m-bottom_medium">
                        This account has multiple active contracts. Choose one to open.
                    </p>
                    <div class="table-wrap">
                        <table class="selector-table slds-table slds-table_bordered slds-table_cell-buffer">
                            <thead>
                                <tr>
                                    <th scope="col" class="radio-col">Select</th>
                                    <th scope="col">Contract Number</th>
                                    <th scope="col">Location Name</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={contractRows} for:item="row">
                                    <tr key={row.contractId}>
                                        <td class="radio-col">
                                            <lightning-input
                                                type="radio"
                                                variant="label-hidden"
                                                name="contractSelector"
                                                data-id={row.contractId}
                                                checked={row.selected}
                                                onchange={handleSelectionChange}>
                                            </lightning-input>
                                        </td>
                                        <td>{row.contractNumber}</td>
                                        <td>{row.locationNameLabel}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </section>
            </template>

            <template if:true={showNotFound}>
                <section class="glass-card slds-p-around_large slds-text-align_center">
                    <p class="title">Active contract not found.</p>
                    <p class="subtitle">No activated contract was found for this account.</p>
                </section>
            </template>

            <template if:true={hasError}>
                <section class="glass-card error-card slds-p-around_large slds-text-align_center">
                    <p class="title">Unable to load contracts</p>
                    <p class="subtitle">{errorMessage}</p>
                </section>
            </template>
        </div>

        <div slot="footer" class="footer-actions">
            <template if:true={showSelector}>
                <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-horizontal_small"></lightning-button>
                <lightning-button
                    variant="brand"
                    label="Open Contract"
                    onclick={handleOpenContract}
                    disabled={disableOpenButton}>
                </lightning-button>
            </template>
            <template if:true={showNotFound}>
                <lightning-button variant="brand" label="Close" onclick={handleCancel}></lightning-button>
            </template>
            <template if:true={hasError}>
                <lightning-button variant="brand" label="Close" onclick={handleCancel}></lightning-button>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
