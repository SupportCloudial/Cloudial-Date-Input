<template>
    <lightning-quick-action-panel header="Terminate Contract">
        <template if:true={loading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <template if:true={showInputForm}>
            <div class="slds-p-around_medium">
                <div class="header-block slds-m-bottom_medium">
                    <p class="header-title">⚠️ Terminate Contract</p>
                    <p class="header-subtitle">
                        This action will mark the contract as terminated. Please provide the termination date and reason below.
                    </p>
                </div>

                <div class="info-block slds-m-bottom_medium">
                    <div class="detail-row">
                        <span class="detail-label">Contract Number:</span>
                        <span class="detail-value">{contractInfo.contractNumber}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Account:</span>
                        <span class="detail-value">{contractInfo.accountName}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status:</span>
                        <span class="detail-value">{contractInfo.status}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Start Date:</span>
                        <span class="detail-value">
                            <lightning-formatted-date-time value={contractInfo.startDate} year="numeric" month="2-digit" day="2-digit"></lightning-formatted-date-time>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">End Date:</span>
                        <span class="detail-value">
                            <lightning-formatted-date-time value={contractInfo.endDate} year="numeric" month="2-digit" day="2-digit"></lightning-formatted-date-time>
                        </span>
                    </div>
                </div>

                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <p class="slds-m-bottom_x-small">
                            <strong>Next Possible Termination Date:</strong>
                            <lightning-formatted-date-time value={contractInfo.nextPossibleTerminationDate} year="numeric" month="2-digit" day="2-digit"></lightning-formatted-date-time>
                        </p>
                        <p class="slds-m-bottom_x-small">
                            <strong>Last Termination Date:</strong>
                            <span>&nbsp;</span>
                            <lightning-formatted-date-time value={contractInfo.lastTerminationDate} year="numeric" month="2-digit" day="2-digit"></lightning-formatted-date-time>
                        </p>
                        <p class="notice-caption slds-m-bottom_medium">
                            Last Termination Date is calculated as Contract End Date - Notice Period.
                        </p>

                        <c-package-builder-locale-date-input
                            label="Contract Termination Date"
                            required
                            value={terminationDate}
                            onchange={handleDateChange}
                        ></c-package-builder-locale-date-input>

                        <template if:true={showFeeField}>
                            <lightning-input
                                class="slds-m-top_medium"
                                type="number"
                                step="0.01"
                                formatter="currency"
                                label="Early Termination Fee"
                                value={earlyTerminationFee}
                                onchange={handleFeeChange}
                                required>
                            </lightning-input>
                            <p class="notice-caption slds-m-top_x-small">
                                Please provide the termination fee as selected contract termination date is before last termination date.
                            </p>
                        </template>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <lightning-radio-group
                            name="terminationReason"
                            label="Termination Reason *"
                            options={reasonOptions}
                            value={terminationReason}
                            onchange={handleReasonChange}
                            type="radio"
                            required>
                        </lightning-radio-group>
                    </div>
                </div>

                <template if:true={hasError}>
                    <div class="error-box slds-m-top_medium">{errorMessage}</div>
                </template>
            </div>
        </template>

        <template if:true={successResult}>
            <div class="slds-p-around_medium">
                <div class="success-title">✓ Contract Terminated Successfully</div>
                <div class="success-details">
                    <p class="slds-m-bottom_small"><strong>Termination Details:</strong></p>
                    <div class="detail-row">
                        <span class="detail-label">Contract Number:</span>
                        <span class="detail-value">{successResult.contractNumber}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Account:</span>
                        <span class="detail-value">{successResult.accountName}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Termination Date:</span>
                        <span class="detail-value">
                            <lightning-formatted-date-time value={successResult.terminationDate} year="numeric" month="2-digit" day="2-digit"></lightning-formatted-date-time>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Termination Reason:</span>
                        <span class="detail-value">{successResult.terminationReason}</span>
                    </div>
                </div>
                <div class="slds-m-top_medium slds-text-align_center">
                    The contract has been updated. Click "Finish" to return to the contract record.
                </div>
            </div>
        </template>

        <template if:true={showErrorScreen}>
            <div class="slds-p-around_medium">
                <p class="error-title">Technical Error:</p>
                <p class="error-details">{errorMessage}</p>
            </div>
        </template>

        <div slot="footer" class="footer-center">
            <template if:true={showInputForm}>
                <lightning-button
                    label="Cancel"
                    onclick={handleClose}
                    disabled={saving}
                    class="slds-m-horizontal_small">
                </lightning-button>
                <template if:true={saving}>
                    <lightning-spinner
                        size="small"
                        alternative-text="Terminating"
                        class="inline-spinner slds-m-horizontal_small">
                    </lightning-spinner>
                </template>
                <lightning-button
                    variant="brand"
                    label={terminateButtonLabel}
                    onclick={handleTerminate}
                    disabled={saving}>
                </lightning-button>
            </template>
            <template if:true={successResult}>
                <lightning-button
                    variant="brand"
                    label="Finish"
                    onclick={handleClose}>
                </lightning-button>
            </template>
            <template if:true={showErrorScreen}>
                <lightning-button
                    label="Previous"
                    onclick={handlePreviousFromError}
                    class="slds-m-horizontal_small">
                </lightning-button>
                <lightning-button
                    variant="brand"
                    label="Finish"
                    onclick={handleClose}>
                </lightning-button>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
