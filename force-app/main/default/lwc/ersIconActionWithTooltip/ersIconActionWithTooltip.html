<template>
  <template lwc:if={showButton}>
    <c-ers-tooltip message={tooltip}>
      <span>
        <button
          type="button"
          class={buttonClass}
          aria-label={alternativeText}
          aria-disabled={ariaDisabled}
          onclick={handleClick}
        >
          <template lwc:if={useImageIcon}>
            <img src={iconSrc} alt="" class="ers-action-btn__img" role="presentation" />
          </template>
          <template lwc:else>
            <lightning-icon icon-name={iconName} size={size} alternative-text=""></lightning-icon>
          </template>
        </button>
      </span>
    </c-ers-tooltip>
  </template>
</template>
