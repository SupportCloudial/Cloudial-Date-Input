<template>
  <template if:true={showEditor}>
    <div class={dateEditorWrapperClass}>
      <lightning-input
        class="date-editor"
        type="date"
        variant="label-hidden"
        date-style="short"
        value={editorValue}
        onchange={handleDateChange}
        onblur={handleDateBlur}
      ></lightning-input>
    </div>
  </template>
  <template if:false={showEditor}>
    <div class={dateCellRootClass}>
      <template if:true={hasEndDateTooltip}>
        <div class="date-cell__value" onclick={editDate} onkeydown={handleKeyDown} role="button" tabindex="0">
          <c-ers-tooltip message={tooltipMessage}>
            <span>
              <template if:true={value}>
                <lightning-formatted-date-time
                  value={value}
                  year="numeric"
                  month="2-digit"
                  day="2-digit"
                  time-zone="UTC"
                ></lightning-formatted-date-time>
              </template>
              <template if:true={showDashWhenEmpty}>
                <span>-</span>
              </template>
            </span>
          </c-ers-tooltip>
        </div>
      </template>
      <template if:false={hasEndDateTooltip}>
        <div class="date-cell__value" onclick={editDate} onkeydown={handleKeyDown} role="button" tabindex="0">
          <template if:true={value}>
            <lightning-formatted-date-time
              value={value}
              year="numeric"
              month="2-digit"
              day="2-digit"
              time-zone="UTC"
            ></lightning-formatted-date-time>
          </template>
          <template if:true={showDashWhenEmpty}>
            <span>-</span>
          </template>
        </div>
      </template>
      <template if:true={isCellEditable}>
        <div class="date-cell__icon">
          <lightning-button-icon
            icon-name="utility:edit"
            size="x-small"
            variant="bare"
            class="cell-icon__edit"
            onclick={editDate}
            alternative-text="Edit date"
          ></lightning-button-icon>
        </div>
      </template>
    </div>
  </template>
</template>
