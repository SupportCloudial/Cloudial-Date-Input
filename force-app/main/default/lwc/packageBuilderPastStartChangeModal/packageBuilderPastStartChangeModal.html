<template>
  <div class={backdropClass} onclick={handleBackdropClick}></div>
  <aside
    class={sheetClass}
    role="dialog"
    aria-label={modalTitle}
    aria-hidden={ariaHidden}
    onkeydown={handleKeydown}
  >
    <header class="pb-ctr-sheet__header">
      <div class="pb-ctr-sheet__title-row">
        <div class="pb-ctr-sheet__header-edge" aria-hidden="true"></div>
        <div class="pb-ctr-sheet__title">{modalTitle}</div>
        <div class="pb-ctr-sheet__header-edge pb-ctr-sheet__header-edge--end">
          <button
            type="button"
            data-pb-past-start-close
            class="pb-ctr-sheet__close-btn"
            aria-label="Close"
            title="Close"
            onclick={handleClose}
            disabled={isSaving}
          >
            <lightning-icon
              icon-name="utility:close"
              size="x-small"
              alternative-text=""
            ></lightning-icon>
          </button>
        </div>
      </div>
    </header>

    <div class="pb-ctr-sheet__body">
      <div class="slds-form slds-form_stacked">
        <template lwc:if={isAccessTypeMode}>
          <template lwc:if={showAccessTypePickerUi}>
            <lightning-combobox
              label={labels.accessType}
              value={selectedAccessType}
              options={accessTypePickerOptions}
              onchange={handleAccessTypePickerChange}
              required
              class="slds-m-bottom_small"
              disabled={isSaving}
            ></lightning-combobox>
          </template>
          <template lwc:elseif={showFlipAccessTypeSentence}>
            <div
              class="slds-text-body_small slds-m-bottom_small slds-text-color_weak"
            >
              New line access type: {flippedAccessType} (from
              {currentAccessType})
            </div>
          </template>
        </template>
        <c-package-builder-locale-date-input
          class="pb-ctr-sheet-locale-date-host"
          label="Start date"
          value={entryDateStr}
          min={entryDateMinYmd}
          max={entryDateMaxYmd}
          required
          disabled={isSaving}
          input-class="pb-ctr-sheet-entry-date-input"
          onchange={handleEntryChange}
        ></c-package-builder-locale-date-input>
        <template lwc:if={showEndDateField}>
          <c-package-builder-locale-date-input
            class="pb-ctr-sheet-locale-date-host slds-m-top_small"
            label={endDateLabel}
            value={endDateStr}
            min={endDateMinYmd}
            max={endDateMaxYmd}
            required
            disabled={isSaving}
            input-class="pb-ctr-sheet-entry-date-input"
            onchange={handleEndDateChange}
          ></c-package-builder-locale-date-input>
          <div
            class="slds-text-body_small slds-m-top_x-small slds-text-color_weak"
          >
            End date applies to the new line only.
          </div>
        </template>
        <template lwc:if={isQuantityMode}>
          <lightning-input
            type="number"
            label={valueLabel}
            value={quantityInput}
            step="any"
            min="0"
            onchange={handleQtyChange}
            required
            class="slds-m-top_small"
            disabled={isSaving}
          ></lightning-input>
        </template>
      </div>
    </div>

    <footer class="pb-ctr-sheet__footer">
      <div class="pb-ctr-sheet__footer-inner">
        <lightning-button
          label="Cancel"
          onclick={handleClose}
          disabled={isSaving}
        ></lightning-button>
        <lightning-button
          variant="brand"
          label="Save"
          onclick={handleSave}
          disabled={isSaving}
        ></lightning-button>
      </div>
    </footer>
  </aside>
</template>
