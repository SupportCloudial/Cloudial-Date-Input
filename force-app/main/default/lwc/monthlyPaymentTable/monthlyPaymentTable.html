<template>
  <div class="mp-form">
    <template lwc:if={isLoadingPayments}>
      <div class="mp-loading" role="status" aria-live="polite">
        <lightning-spinner
          alternative-text="Loading monthly payments"
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <template lwc:elseif={showEmptyState}>
      <template lwc:if={showRecurringPriceIncreaseButton}>
        <div class="mp-recurring-actions slds-m-bottom_small">
          <lightning-button
            label="Recurring Price Increase"
            icon-name="utility:trending"
            onclick={handleOpenRecurringPriceIncrease}
          ></lightning-button>
        </div>
      </template>
      <div class="mp-empty-state" role="status" aria-live="polite">
        <p class="mp-empty-state__message">
          {customLabels.emptyPaymentsMessage}
        </p>
        <p
          class="mp-empty-state__hint slds-text-body_small slds-text-color_weak"
        >
          {customLabels.emptyPaymentsHint}
        </p>
      </div>
    </template>

    <template lwc:elseif={showPaymentsWorkspace}>
      <template lwc:if={showGlobalReadOnlyBanner}>
        <div
          class="slds-box slds-theme_shade slds-m-bottom_small slds-text-body_small slds-text-color_weak"
        >
          View only — adjustments cannot be edited from this view.
        </div>
      </template>
      <template lwc:if={showRecurringPriceIncreaseButton}>
        <div class="mp-recurring-actions slds-m-bottom_small">
          <lightning-button
            label="Recurring Price Increase"
            icon-name="utility:trending"
            onclick={handleOpenRecurringPriceIncrease}
          ></lightning-button>
        </div>
      </template>
      <div class="mp-optimizer">
        <template lwc:if={hasSelection}>
          <template lwc:if={showGlobalReadOnlyBanner}>
            <div class="mp-empty mp-empty--optimizer"></div>
          </template>
          <template lwc:else>
            <template lwc:if={showBulkOptimizer}>
              <template lwc:if={showLinkedPriceFields}>
                <div class="mp-optimizer__row">
                  <div class="mp-optimizer__col">
                    <div class="mp-label">Desk price</div>
                    <lightning-input
                      type="number"
                      step="any"
                      data-field="deskPrice"
                      value={deskPriceInput}
                      variant="label-hidden"
                      oninput={handleDeskPriceFieldInput}
                      onchange={handleDeskPriceFieldChange}
                    ></lightning-input>
                  </div>
                  <div class="mp-optimizer__col">
                    <div class="mp-label">Product price</div>
                    <lightning-input
                      type="number"
                      step="any"
                      data-field="productPrice"
                      value={productPriceInput}
                      variant="label-hidden"
                      oninput={handleProductPriceFieldInput}
                      onchange={handleProductPriceFieldChange}
                    ></lightning-input>
                  </div>
                </div>
              </template>
              <div class="mp-optimizer__row">
                <div class="mp-optimizer__col">
                  <div class="mp-label">Scope</div>
                  <div class="mp-seg" role="group" aria-label="Scope">
                    <button
                      type="button"
                      class={scopeYearBtnClass}
                      data-name="discountApplyChoice"
                      data-value="Year"
                      aria-pressed={isScopeYear}
                      onclick={handleSegmentedClick}
                    >
                      Year
                    </button>
                    <button
                      type="button"
                      class={scopeCustomBtnClass}
                      data-name="discountApplyChoice"
                      data-value="Custom"
                      aria-pressed={isScopeCustom}
                      onclick={handleSegmentedClick}
                    >
                      Custom
                    </button>
                  </div>
                </div>
                <div class="mp-optimizer__col">
                  <div class="mp-label">Discount Format</div>
                  <div
                    class="mp-seg"
                    role="group"
                    aria-label="Discount Formats"
                  >
                    <button
                      type="button"
                      class={formatAmountBtnClass}
                      data-name="discountFormat"
                      data-value="Amount"
                      aria-pressed={isFormatAmount}
                      onclick={handleSegmentedClick}
                    >
                      Amount
                    </button>
                    <button
                      type="button"
                      class={formatPercentBtnClass}
                      data-name="discountFormat"
                      data-value="Percentage"
                      aria-pressed={isFormatPercentage}
                      onclick={handleSegmentedClick}
                    >
                      %
                    </button>
                  </div>
                </div>
              </div>

              <template lwc:if={isYear}>
                <div class="mp-optimizer__row mp-optimizer__row--year-fields">
                  <div class="mp-optimizer__col">
                    <div class="mp-label">Year</div>
                    <lightning-combobox
                      class="mp-year-select"
                      name="yearToApplyDiscount"
                      variant="label-hidden"
                      placeholder="Choose year"
                      value={yearToApplyDiscount}
                      options={yearsDate}
                      onchange={handleDiscountMultipleValue}
                    ></lightning-combobox>
                  </div>
                  <div class="mp-optimizer__col">
                    <template lwc:if={showLinkedPriceFields}>
                      <div class="mp-label">{linkedDiscountFieldLabel}</div>
                      <lightning-input
                        class="mp-year-adjustment-input"
                        type="number"
                        step="any"
                        data-field="linkedDiscount"
                        value={linkedDiscountInputValue}
                        variant="label-hidden"
                        onchange={handleLinkedDiscountFieldChange}
                      ></lightning-input>
                    </template>
                    <template lwc:else>
                      <div class="mp-label">Adjustment</div>
                      <lightning-input
                        class="mp-year-adjustment-input"
                        type="number"
                        step="any"
                        name="globalDiscount"
                        label="Adjustment"
                        variant="label-hidden"
                        value={globalDiscount}
                        onchange={handleFormatDiscount}
                      ></lightning-input>
                    </template>
                  </div>
                </div>
              </template>
              <template lwc:else>
                <template lwc:if={showLinkedPriceFields}>
                  <div class="mp-optimizer__row">
                    <div class="mp-optimizer__col mp-optimizer__col--wide">
                      <div class="mp-label">{linkedDiscountFieldLabel}</div>
                      <lightning-input
                        type="number"
                        step="any"
                        data-field="linkedDiscount"
                        value={linkedDiscountInputValue}
                        variant="label-hidden"
                        onchange={handleLinkedDiscountFieldChange}
                      ></lightning-input>
                    </div>
                  </div>
                </template>
                <template lwc:elseif={showOptimizerAdjustmentField}>
                  <div class="mp-optimizer__row">
                    <div class="mp-optimizer__col mp-optimizer__col--wide">
                      <div class="mp-label">Adjustment</div>
                      <lightning-input
                        type="number"
                        step="any"
                        name="globalDiscount"
                        value={globalDiscount}
                        onchange={handleFormatDiscount}
                      ></lightning-input>
                    </div>
                  </div>
                </template>
                <div class="mp-optimizer__row">
                  <div
                    class="mp-optimizer__col mp-optimizer__col--wide mp-optimizer__range mp-optimizer__range--single-row"
                  >
                    <c-package-builder-locale-date-input
                      data-name="customStartDate"
                      label={customLabels.startDate_label}
                      value={customStartDate}
                      min={calendarMinDate}
                      max={calendarMaxDate}
                      onchange={handleCustomDateChange}
                    ></c-package-builder-locale-date-input>
                    <c-package-builder-locale-date-input
                      data-name="customEndDate"
                      label={customLabels.endDate_label}
                      value={customEndDate}
                      min={endDateMin}
                      max={calendarMaxDate}
                      onchange={handleCustomDateChange}
                    ></c-package-builder-locale-date-input>
                  </div>
                </div>
                <div class="mp-optimizer__row" lwc:if={hasCustomRangeError}>
                  <div class="mp-optimizer__col mp-optimizer__col--wide">
                    <div class="slds-text-color_error slds-text-body_small">
                      {customRangeErrorMessage}
                    </div>
                  </div>
                </div>
              </template>

              <template lwc:if={showBulkReplaceAddChoice}>
                <div class="mp-optimizer__row mp-optimizer__row--bulk-action">
                  <div class="mp-optimizer__col mp-optimizer__col--wide">
                    <lightning-radio-group
                      name="bulkAdjustmentAction"
                      label={customLabels.adjustmentAction}
                      options={adjustmentActionOptions}
                      value={bulkAdjustmentAction}
                      type="radio"
                      onchange={handleBulkAdjustmentActionChange}
                    ></lightning-radio-group>
                    <p class="slds-m-top_x-small">{bulkAdjustmentActionHelp}</p>
                    <template lwc:if={bulkAddWarning}>
                      <div
                        class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_small"
                        role="alert"
                      >
                        {bulkAddWarning}
                      </div>
                    </template>
                    <template lwc:if={bulkRecurringWarning}>
                      <div
                        class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_small"
                        role="alert"
                      >
                        {bulkRecurringWarning}
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <div class="mp-optimizer__actions">
                <div class="mp-optimizer__actions-left">
                  <lightning-button
                    class="applyButton"
                    variant="brand"
                    onclick={handleApplyOptimizer}
                    label="Apply to selected"
                    disabled={isApplyDiscountDisabled}
                  ></lightning-button>
                </div>
                <button
                  class="mp-link"
                  type="button"
                  onclick={resetPriceOptimizerBlock}
                >
                  Reset
                </button>
              </div>
            </template>
          </template>
        </template>
      </div>

      <div class={tableRegionClass}>
        <template lwc:if={hasMonthlyPaymentData}>
          <div
            class={scrollTopClass}
            data-id="scrollTop"
            onscroll={handleTopScroll}
          >
            <div class="mp-scroll-top-inner" data-id="scrollTopInner"></div>
          </div>
          <div
            class={tableWrapClass}
            data-id="scrollMain"
            onscroll={handleMainScroll}
          >
            <table class="mp-table">
              <thead>
                <tr>
                  <th class="mp-th mp-th--sticky mp-th--month">Month</th>
                  <template for:each={selectedProductsMeta} for:item="prod">
                    <th key={prod.id} class="mp-th mp-th--product">
                      <div class="mp-th__product">
                        <div>{prod.displayName}</div>
                        <div class="mp-muted">{prod.deskcount} desks</div>
                      </div>
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template for:each={monthRows} for:item="row">
                  <tr key={row.key}>
                    <td class="mp-td mp-td--sticky mp-td--month">
                      <b>{row.label}</b>
                    </td>
                    <template for:each={row.cells} for:item="col">
                      <td key={col.key} class="mp-td mp-td--cell">
                        <template lwc:if={col.cell}>
                          <div class={col.cell.cellGridClass}>
                            <template lwc:if={col.isUsageBased}>
                              <div class="cell-label">
                                {customLabels.finalPrice}
                              </div>
                              <div class="cell-value">
                                <input
                                  name="finalPrice"
                                  class={col.cell.finalPriceClass}
                                  type="text"
                                  data-month={row.month}
                                  data-year={row.year}
                                  data-product-id={col.prodId}
                                  data-row-idx={row.rowIndex}
                                  data-col-idx={col.colIndex}
                                  data-field="finalPrice"
                                  value={col.cell.finalPriceInputValue}
                                  disabled={col.cell.finalPriceReadOnly}
                                  onchange={handleFinalPriceChange}
                                  onkeydown={handleCellKeyDown}
                                />
                              </div>
                            </template>
                            <template lwc:else>
                              <div class="cell-label">
                                {customLabels.listPrice}
                              </div>
                              <div class="cell-value strike-through">
                                {col.cell.listPrice}
                              </div>

                              <div class="cell-label">
                                {customLabels.priceAdj}
                                <span class="tooltip-container">
                                  <lightning-icon
                                    icon-name="utility:info"
                                    size="xx-small"
                                    class="info-icon"
                                  ></lightning-icon>
                                  <span class="tooltip-text"
                                    >{customLabels.helpText}</span
                                  >
                                </span>
                              </div>
                              <div class="cell-value input-wrapper">
                                <span
                                  class={col.cell.arrowClass}
                                  title={col.cell.deltaTooltip}
                                  >&#9650;</span
                                >
                                <input
                                  name="discount"
                                  class="modern-input"
                                  type="text"
                                  data-month={row.month}
                                  data-year={row.year}
                                  data-product-id={col.prodId}
                                  data-row-idx={row.rowIndex}
                                  data-col-idx={col.colIndex}
                                  data-field="discount"
                                  value={col.cell.discount}
                                  readonly={col.cell.standardReadOnly}
                                  onchange={handleDiscountChange}
                                  onkeydown={handleCellKeyDown}
                                />
                              </div>

                              <div class="cell-label">
                                {customLabels.finalPrice}
                              </div>
                              <div class="cell-value">
                                <input
                                  name="finalPrice"
                                  class={col.cell.finalPriceClass}
                                  type="text"
                                  data-month={row.month}
                                  data-year={row.year}
                                  data-product-id={col.prodId}
                                  data-row-idx={row.rowIndex}
                                  data-col-idx={col.colIndex}
                                  data-field="finalPrice"
                                  value={col.cell.finalPrice}
                                  readonly={col.cell.standardReadOnly}
                                  onchange={handleFinalPriceChange}
                                  onkeydown={handleCellKeyDown}
                                />
                              </div>
                            </template>
                          </div>
                        </template>
                        <template lwc:else>
                          <div class="mp-muted">—</div>
                        </template>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <template lwc:else>
          <div class="mp-empty mp-empty--table">
            <p class="mp-empty-state__message">
              {customLabels.emptyPaymentsMessage}
            </p>
          </div>
        </template>
      </div>

      <template lwc:if={showSaveCancelToolbar}>
        <div class="mp-draft-toolbar">
          <template lwc:if={showBulkToolbarReplaceAddChoice}>
            <div class="mp-draft-toolbar__bulk-choice">
              <lightning-radio-group
                name="bulkAdjustmentActionSave"
                label={customLabels.adjustmentAction}
                options={adjustmentActionOptions}
                value={bulkAdjustmentAction}
                type="radio"
                onchange={handleBulkAdjustmentActionChange}
              ></lightning-radio-group>
              <p class="slds-m-top_x-small">{bulkAdjustmentActionHelp}</p>
              <template lwc:if={bulkAddWarning}>
                <div
                  class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_small"
                  role="alert"
                >
                  {bulkAddWarning}
                </div>
              </template>
              <template lwc:if={bulkRecurringWarning}>
                <div
                  class="slds-notify slds-notify_alert slds-alert_warning slds-m-top_small"
                  role="alert"
                >
                  {bulkRecurringWarning}
                </div>
              </template>
            </div>
          </template>
          <div
            class="mp-draft-toolbar__hint slds-text-body_small slds-text-color_weak"
          >
            Unsaved changes
          </div>
          <div class="mp-draft-toolbar__actions">
            <span class="mp-draft-toolbar__save-wrap">
              <template lwc:if={savingDiscounts}>
                <lightning-spinner
                  alternative-text="Saving…"
                  size="small"
                  class="mp-draft-toolbar__spinner"
                ></lightning-spinner>
              </template>
              <lightning-button
                variant="brand"
                label="Save"
                onclick={handleSaveDiscountsClick}
                disabled={saveDiscountsDisabled}
              ></lightning-button>
            </span>
            <lightning-button
              variant="neutral"
              label="Discard"
              onclick={handleCancelClick}
              disabled={cancelDiscountsDisabled}
            ></lightning-button>
          </div>
        </div>
      </template>
    </template>

    <template lwc:if={showAdjustmentPreview}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="adjustment-preview-heading"
        class="slds-modal slds-modal_small slds-fade-in-open"
        data-id="adjustment-preview"
      >
        <div class="slds-modal__container adjustment-preview-container">
          <header class="slds-modal__header">
            <button
              class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
              title={customLabels.adjustmentCancel}
              onclick={closeAdjustmentPreview}
            >
              <lightning-icon
                icon-name="utility:close"
                alternative-text={customLabels.adjustmentCancel}
                size="small"
                variant="inverse"
              ></lightning-icon>
            </button>
            <h2
              id="adjustment-preview-heading"
              class="slds-text-heading_medium"
            >
              {adjustmentPreviewTitle}
            </h2>
          </header>
          <div class="slds-modal__content adjustment-preview-content">
            <div class="adjustment-preview-body">
              <template lwc:if={showAdjustmentPreviewInitialLoading}>
                <div
                  class="adjustment-preview-loading"
                  role="status"
                  aria-live="polite"
                >
                  <lightning-spinner
                    alternative-text={customLabels.adjustmentCalculatingPreview}
                    size="small"
                  ></lightning-spinner>
                  <p
                    class="adjustment-preview-loading-label slds-text-body_small"
                  >
                    {customLabels.adjustmentCalculatingPreview}
                  </p>
                </div>
              </template>
              <template lwc:else>
                <div class={adjustmentPreviewPanelClass}>
                  <template lwc:if={showAdjustmentPreviewRefreshing}>
                    <div
                      class="adjustment-preview-refresh"
                      role="status"
                      aria-live="polite"
                    >
                      <lightning-spinner
                        alternative-text={customLabels.adjustmentCalculatingPreview}
                        size="small"
                      ></lightning-spinner>
                    </div>
                  </template>
                  <div class="adjustment-preview-action">
                    <lightning-radio-group
                      name="adjustmentAction"
                      label={customLabels.adjustmentAction}
                      options={adjustmentActionOptions}
                      value={adjustmentAction}
                      type="button"
                      onchange={handleAdjustmentActionChange}
                      disabled={adjustmentPreviewLoading}
                    ></lightning-radio-group>
                    <p class="adjustment-preview-help">
                      {adjustmentActionHelp}
                    </p>
                  </div>
                  <template lwc:if={adjustmentRecurringWarning}>
                    <div
                      class="slds-notify slds-notify_alert slds-alert_warning adjustment-preview-warning"
                      role="alert"
                    >
                      {adjustmentRecurringWarning}
                    </div>
                  </template>
                  <dl class="adjustment-preview-summary">
                    <div class="adjustment-preview-row">
                      <dt>{customLabels.adjustmentOriginalPrice}</dt>
                      <dd>{adjustmentPreviewOutcome.originalPrice}</dd>
                    </div>
                    <div class="adjustment-preview-row">
                      <dt>{customLabels.adjustmentExistingAdjustment}</dt>
                      <dd>{adjustmentExistingDisplay}</dd>
                    </div>
                    <div class="adjustment-preview-row">
                      <dt>{customLabels.adjustmentPriceBefore}</dt>
                      <dd>{adjustmentPreviewOutcome.priceBefore}</dd>
                    </div>
                    <div class="adjustment-preview-row">
                      <dt>{customLabels.adjustmentEnteredAdjustment}</dt>
                      <dd>{adjustmentEnteredDisplay}</dd>
                    </div>
                    <div class="adjustment-preview-row">
                      <dt>{customLabels.adjustmentSelectedAction}</dt>
                      <dd>{adjustmentActionLabel}</dd>
                    </div>
                    <div class="adjustment-preview-row">
                      <dt>{customLabels.adjustmentResultingAdjustment}</dt>
                      <dd>{adjustmentResultingDisplay}</dd>
                    </div>
                    <div
                      class="adjustment-preview-row adjustment-preview-row_emphasis"
                    >
                      <dt>{customLabels.adjustmentFinalPriceAfter}</dt>
                      <dd>{adjustmentPreviewOutcome.finalPriceAfter}</dd>
                    </div>
                  </dl>
                </div>
              </template>
            </div>
          </div>
          <footer class="slds-modal__footer">
            <lightning-button
              variant="neutral"
              label={customLabels.adjustmentCancel}
              onclick={closeAdjustmentPreview}
            ></lightning-button>
            <lightning-button
              class="slds-m-horizontal_x-small"
              variant="brand"
              label={customLabels.adjustmentConfirm}
              onclick={confirmAdjustmentPreview}
              disabled={adjustmentPreviewLoading}
            ></lightning-button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </div>
</template>
