<template>
  <!-- Toolbar-only (Contract draft without table) -->
  <template lwc:if={toolbarOnly}>
    <div
      class="products-panel products-panel--toolbar-only slds-m-bottom_medium"
    >
      <template lwc:if={showToolbar}>
        <div class="products-toolbar">
          <div class="products-toolbar__accent"></div>
          <template lwc:if={contractStatusBannerMessage}>
            <div
              class="products-toolbar__contract-banner slds-scoped-notification slds-media slds-media_center"
              role="status"
            >
              <div class="slds-media__figure">
                <lightning-icon
                  icon-name="utility:info"
                  size="small"
                  alternative-text="Information"
                  class="products-toolbar__contract-banner-icon"
                ></lightning-icon>
              </div>
              <div class="slds-media__body">
                <p class="products-toolbar__contract-banner-text">
                  {contractStatusBannerMessage}
                </p>
              </div>
            </div>
          </template>
          <div class="products-toolbar__inner">
            <div class="products-toolbar__title-row">
              <div class="products-toolbar__title-cluster">
                <h3 class="products-toolbar__heading section-title">
                  Products
                  <span class="products-toolbar__count" aria-hidden="true"
                    >({productsHeaderCount})</span
                  >
                </h3>
              </div>
              <slot name="toolbar-version-start"></slot>
            </div>

            <div
              class="products-toolbar__actions"
              role="toolbar"
              aria-label="Product actions"
            >
              <div
                class="products-toolbar__group"
                role="group"
                aria-label="Add product actions"
              >
                <lightning-button
                  label="Add Product"
                  icon-name="utility:add"
                  variant="neutral"
                  disabled={isAddProductDisabled}
                  onclick={handleAddProduct}
                  class="products-toolbar__action"
                ></lightning-button>
                <template lwc:if={enableToolbarTooltips}>
                  <c-ers-tooltip
                    message={monthlyPaymentsButtonTitle}
                    hover-only
                  >
                    <span>
                      <lightning-button
                        label="Monthly Payments"
                        icon-name="utility:moneybag"
                        variant="neutral"
                        title="Monthly Payments"
                        onclick={handleOpenMonthlyPayments}
                        disabled={isMonthlyPaymentsDisabled}
                        class="products-toolbar__action"
                      ></lightning-button>
                    </span>
                  </c-ers-tooltip>
                </template>
                <template lwc:else>
                  <lightning-button
                    label="Monthly Payments"
                    icon-name="utility:moneybag"
                    variant="neutral"
                    title="Monthly Payments"
                    onclick={handleOpenMonthlyPayments}
                    disabled={isMonthlyPaymentsDisabled}
                    class="products-toolbar__action"
                  ></lightning-button>
                </template>
              </div>

              <div
                class="products-toolbar__group"
                role="group"
                aria-label="Bulk actions"
              >
                <template lwc:if={showIterationsButton}>
                  <lightning-button
                    label="Iterations"
                    icon-name="utility:sync"
                    variant="neutral"
                    onclick={handleIterations}
                    class="products-toolbar__action"
                  ></lightning-button>
                </template>
                <template lwc:if={showBulkEditButton}>
                  <c-ers-tooltip message={bulkEditButtonTitle} hover-only>
                    <span>
                      <lightning-button
                        label="Bulk Edit"
                        icon-name="utility:edit"
                        variant="neutral"
                        title={bulkEditButtonTitle}
                        disabled={terminateDisabled}
                        onclick={handleBulkEdit}
                        class="products-toolbar__action"
                      ></lightning-button>
                    </span>
                  </c-ers-tooltip>
                </template>
                <template lwc:if={showTerminateButton}>
                  <c-ers-tooltip message={terminateButtonTitle} hover-only>
                    <span>
                      <lightning-button
                        label="Terminate Products"
                        icon-name="utility:close"
                        variant="neutral"
                        title={terminateButtonTitle}
                        disabled={terminateDisabled}
                        onclick={handleTerminateProducts}
                        class="products-toolbar__action"
                      ></lightning-button>
                    </span>
                  </c-ers-tooltip>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- Toolbar + tables -->
  <template lwc:else>
    <div class="products-panel slds-m-bottom_medium">
      <template lwc:if={showToolbar}>
        <div class="products-toolbar">
          <div class="products-toolbar__accent"></div>
          <template lwc:if={contractStatusBannerMessage}>
            <div
              class="products-toolbar__contract-banner slds-scoped-notification slds-media slds-media_center"
              role="status"
            >
              <div class="slds-media__figure">
                <lightning-icon
                  icon-name="utility:info"
                  size="small"
                  alternative-text="Information"
                  class="products-toolbar__contract-banner-icon"
                ></lightning-icon>
              </div>
              <div class="slds-media__body">
                <p class="products-toolbar__contract-banner-text">
                  {contractStatusBannerMessage}
                </p>
              </div>
            </div>
          </template>
          <div class="products-toolbar__inner">
            <div class="products-toolbar__title-row">
              <div class="products-toolbar__title-cluster">
                <h3 class="products-toolbar__heading section-title">
                  Products
                  <span class="products-toolbar__count" aria-hidden="true"
                    >({productsHeaderCount})</span
                  >
                </h3>
              </div>
              <slot name="toolbar-version-start"></slot>
            </div>

            <div
              class="products-toolbar__actions"
              role="toolbar"
              aria-label="Product actions"
            >
              <div
                class="products-toolbar__group"
                role="group"
                aria-label="Add product actions"
              >
                <lightning-button
                  label="Add Product"
                  icon-name="utility:add"
                  variant="neutral"
                  disabled={isAddProductDisabled}
                  onclick={handleAddProduct}
                  class="products-toolbar__action"
                ></lightning-button>
                <template lwc:if={enableToolbarTooltips}>
                  <c-ers-tooltip
                    message={monthlyPaymentsButtonTitle}
                    hover-only
                  >
                    <span>
                      <lightning-button
                        label="Monthly Payments"
                        icon-name="utility:moneybag"
                        variant="neutral"
                        title="Monthly Payments"
                        onclick={handleOpenMonthlyPayments}
                        disabled={isMonthlyPaymentsDisabled}
                        class="products-toolbar__action"
                      ></lightning-button>
                    </span>
                  </c-ers-tooltip>
                </template>
                <template lwc:else>
                  <lightning-button
                    label="Monthly Payments"
                    icon-name="utility:moneybag"
                    variant="neutral"
                    title="Monthly Payments"
                    onclick={handleOpenMonthlyPayments}
                    disabled={isMonthlyPaymentsDisabled}
                    class="products-toolbar__action"
                  ></lightning-button>
                </template>
              </div>

              <div
                class="products-toolbar__group"
                role="group"
                aria-label="Bulk actions"
              >
                <template lwc:if={showIterationsButton}>
                  <lightning-button
                    label="Iterations"
                    icon-name="utility:sync"
                    variant="neutral"
                    onclick={handleIterations}
                    class="products-toolbar__action"
                  ></lightning-button>
                </template>
                <template lwc:if={showBulkEditButton}>
                  <c-ers-tooltip message={bulkEditButtonTitle} hover-only>
                    <span>
                      <lightning-button
                        label="Bulk Edit"
                        icon-name="utility:edit"
                        variant="neutral"
                        title={bulkEditButtonTitle}
                        disabled={bulkEditDisabled}
                        onclick={handleBulkEdit}
                        class="products-toolbar__action"
                      ></lightning-button>
                    </span>
                  </c-ers-tooltip>
                </template>
                <template lwc:if={showTerminateButton}>
                  <c-ers-tooltip message={terminateButtonTitle} hover-only>
                    <span>
                      <lightning-button
                        label="Terminate Products"
                        icon-name="utility:close"
                        variant="neutral"
                        title={terminateButtonTitle}
                        disabled={bulkEditDisabled}
                        onclick={handleTerminateProducts}
                        class="products-toolbar__action"
                      ></lightning-button>
                    </span>
                  </c-ers-tooltip>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template lwc:if={showEmptyProductHint}>
        <p class="empty-product-hint products-panel__empty-hint">
          Add products by clicking the <strong>+</strong> icon above.
        </p>
      </template>

      <template lwc:if={hasStandardOrExtraProducts}>
        <div class="sections-wrapper">
          <section
            class="product-section product-section-standard"
            aria-label="Products"
          >
            <div class="product-split-block product-split-block--tight">
              <div class={primaryProductsHeaderClass}>
                <lightning-icon
                  icon-name={primaryProductsIconName}
                  size="x-small"
                  alternative-text=""
                  class="products-section-header__icon"
                ></lightning-icon>
                <span class="products-section-header__title"
                  >{primaryProductsHeaderTitle}</span
                >
                <span class="products-section-header__count"
                  >({primaryProductsCount})</span
                >
                <template lwc:if={showSelectAllRoomsAndExtra}>
                  <div class="products-section-header__rooms-extra-select">
                    <c-ers-tooltip
                      message={selectAllRoomsExtraTooltipMessage}
                      hover-only
                    >
                      <span>
                        <lightning-button-icon
                          icon-name="utility:multi_select_checkbox"
                          alternative-text="Select or deselect all in Rooms and Extra"
                          title="Select or deselect all in Rooms and Extra"
                          variant="border-filled"
                          onclick={handleSelectAllRoomsAndExtra}
                          class="products-section-header__select-all-rooms-extra"
                        ></lightning-button-icon>
                      </span>
                    </c-ers-tooltip>
                  </div>
                </template>
                <template lwc:if={showStandardMonthlyTotal}>
                  <span class="products-section-header__summary">
                    <span class="products-section-header__summary-label"
                      >Total Monthly Amount:</span
                    >
                    <span class="products-section-header__summary-value">
                      <span class="products-section-header__currency">₪</span>
                      <lightning-formatted-number
                        value={standardTotalMonthlyAmount}
                        format-style="decimal"
                        minimum-fraction-digits="2"
                        maximum-fraction-digits="2"
                      ></lightning-formatted-number>
                    </span>
                  </span>
                </template>
              </div>
              <div class="table-wrapper">
                <!-- tableContainerClass on host so packageBuilderTableCustom divider CSS :host(...) applies -->
                <template lwc:if={enableDraftEdits}>
                  <c-package-builder-table-custom
                    class={tableContainerClass}
                    key-field="LineItemId"
                    data={standardProducts}
                    columns={displayColumnsStandard}
                    wrap-table-header="all"
                    onsave={handleTableSave}
                    oncellchange={handleCellChange}
                    oncombovaluechange={handleComboValueChange}
                    onfieldpencilclick={handleFieldPencilClick}
                    draft-values={draftValues}
                    onrowselection={handleRowSelectionStandard}
                    onrowaction={handleRowAction}
                    selected-rows={selectedRows}
                    hide-checkbox-column={hideCheckboxColumn}
                    show-row-number-column
                    suppress-bottom-bar
                  ></c-package-builder-table-custom>
                </template>
                <template lwc:else>
                  <c-package-builder-table-custom
                    class={tableContainerClass}
                    key-field="LineItemId"
                    data={standardProducts}
                    columns={displayColumnsStandard}
                    wrap-table-header="all"
                    hide-checkbox-column={hideCheckboxColumn}
                    show-row-number-column
                    onrowaction={handleRowAction}
                  ></c-package-builder-table-custom>
                </template>
              </div>
            </div>

            <template lwc:if={hasParkingProducts}>
              <div class="product-split-block product-split-block--tight">
                <div
                  class="products-section-header products-section-header--parking"
                >
                  <lightning-icon
                    icon-name="utility:apps"
                    size="x-small"
                    alternative-text=""
                    class="products-section-header__icon"
                  ></lightning-icon>
                  <span class="products-section-header__title">Extra</span>
                  <span class="products-section-header__count"
                    >({parkingProductsCount})</span
                  >
                  <template lwc:if={showParkingMonthlyTotal}>
                    <span class="products-section-header__summary">
                      <span class="products-section-header__summary-label"
                        >Total Monthly Amount:</span
                      >
                      <span class="products-section-header__summary-value">
                        <span class="products-section-header__currency">₪</span>
                        <lightning-formatted-number
                          value={parkingTotalMonthlyAmount}
                          format-style="decimal"
                          minimum-fraction-digits="2"
                          maximum-fraction-digits="2"
                        ></lightning-formatted-number>
                      </span>
                    </span>
                  </template>
                </div>
                <div class="table-wrapper">
                  <template lwc:if={enableDraftEdits}>
                    <c-package-builder-table-custom
                      class={tableContainerClass}
                      key-field="LineItemId"
                      data={parkingProducts}
                      columns={displayColumnsParking}
                      wrap-table-header="all"
                      onsave={handleTableSave}
                      oncellchange={handleCellChange}
                      oncombovaluechange={handleComboValueChange}
                      onfieldpencilclick={handleFieldPencilClick}
                      draft-values={draftValues}
                      onrowselection={handleRowSelectionParking}
                      onrowaction={handleRowAction}
                      selected-rows={selectedRows}
                      hide-checkbox-column={hideCheckboxColumn}
                      show-row-number-column
                      suppress-bottom-bar
                    ></c-package-builder-table-custom>
                  </template>
                  <template lwc:else>
                    <c-package-builder-table-custom
                      class={tableContainerClass}
                      key-field="LineItemId"
                      data={parkingProducts}
                      columns={displayColumnsParking}
                      wrap-table-header="all"
                      hide-checkbox-column={hideCheckboxColumn}
                      show-row-number-column
                      onrowaction={handleRowAction}
                    ></c-package-builder-table-custom>
                  </template>
                </div>
              </div>
            </template>

            <template lwc:if={hasContractTermsProducts}>
              <div class="product-split-block product-split-block--tight">
                <div
                  class="products-section-header products-section-header--contract-terms"
                >
                  <lightning-icon
                    icon-name="utility:apps"
                    size="x-small"
                    alternative-text=""
                    class="products-section-header__icon"
                  ></lightning-icon>
                  <span class="products-section-header__title"
                    >Contract Terms</span
                  >
                  <span class="products-section-header__count"
                    >({contractTermsCount})</span
                  >
                </div>
                <div class="table-wrapper">
                  <template lwc:if={enableDraftEdits}>
                    <c-package-builder-table-custom
                      class={extraSectionTableClass}
                      key-field="LineItemId"
                      data={contractTermsProducts}
                      columns={displayColumnsExtra}
                      wrap-table-header="all"
                      onsave={handleTableSave}
                      oncellchange={handleCellChange}
                      oncombovaluechange={handleComboValueChange}
                      onfieldpencilclick={handleFieldPencilClick}
                      draft-values={draftValues}
                      onrowselection={handleRowSelectionExtra}
                      onrowaction={handleRowAction}
                      selected-rows={selectedRows}
                      hide-checkbox-column={hideCheckboxColumn}
                      show-row-number-column
                      suppress-bottom-bar
                    ></c-package-builder-table-custom>
                  </template>
                  <template lwc:else>
                    <c-package-builder-table-custom
                      class={extraSectionTableClass}
                      key-field="LineItemId"
                      data={contractTermsProducts}
                      columns={displayColumnsExtra}
                      wrap-table-header="all"
                      hide-checkbox-column={hideCheckboxColumn}
                      show-row-number-column
                      onrowaction={handleRowAction}
                    ></c-package-builder-table-custom>
                  </template>
                </div>
              </div>
            </template>
          </section>
        </div>
      </template>

      <template lwc:else>
        <template lwc:if={showSectionEmptyMessage}>
          <p class="section-empty-msg">{sectionEmptyMessage}</p>
        </template>
      </template>
    </div>
  </template>
</template>
